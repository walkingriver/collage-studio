# Tests every push. On main, publishes redirect/ to the app's old GitHub Pages location
# (https://walkingriver.com/collage-studio/), which now just sends visitors to the real
# app at https://collagestudio.walkingriver.com/ (deployed separately, via Cloudflare
# Pages — see README.md). Keeping this workflow around is what makes the old, already-
# shared link keep working instead of breaking.
name: Test and publish redirect

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: End-to-end tests (Chrome)
        run: npx playwright test
        env:
          PW_CHANNEL: chrome

  publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect
      - id: deployment
        uses: actions/deploy-pages@v4
